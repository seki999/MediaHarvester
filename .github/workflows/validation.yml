name: Controlled validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      online:
        description: Run bounded public platform checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # Reports compare HEAD against the historical validation baseline.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libopengl0
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/run_full_tests.py --mode offline
      - run: python scripts/gui_workflow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-reports-${{ matrix.python }}
          path: reports/
  online:
    if: github.event_name == 'workflow_dispatch' && inputs.online
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libopengl0
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/run_full_tests.py --mode online
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-reports
          path: reports/
